[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envscope-cli"
version = "0.1.0"
description = "Find environment variables used in code but missing from your example file"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "EnvScope contributors"}]
keywords = ["environment-variables", "dotenv", "cli", "developer-tools"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Topic :: Software Development :: Quality Assurance"]

[project.scripts]
envscope = "envscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
